<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Well English School</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #173b70;
      padding: 24px;
      box-sizing: border-box;
    }
    main {
      max-width: 600px;
    }
    .brand {
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 2px;
    }
    .line {
      width: 65px;
      height: 3px;
      background: #c83232;
      margin: 28px auto;
    }
    h1 {
      font-size: clamp(30px, 6vw, 46px);
      line-height: 1.15;
    }
    p {
      color: #555555;
      font-size: 17px;
      line-height: 1.7;
    }
    .coming {
      margin-top: 35px;
      color: #c83232;
      font-size: 12px;
      letter-spacing: 4px;
    }
  </style>
</head>
<body>
  <main>
    <div class="brand">WELL ENGLISH SCHOOL</div>
    <div class="line"></div>
    <h1>Estamos preparando algo especial.</h1>
    <p>Em breve, um novo capítulo na sua jornada com o inglês.</p>
    <div class="coming">COMING SOON</div>
  </main>
</body>
</html>
